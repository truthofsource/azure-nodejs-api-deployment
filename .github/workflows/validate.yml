name: Node API build and package validation
# Manual-only: no automatic Actions minutes, uploads, Azure credentials or publish.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked sample dependencies
        run: npm ci --prefix sample-api --ignore-scripts --no-audit --no-fund
      - name: Compile and test the actual health handler
        run: npm test --prefix sample-api
      - name: Validate package rejection boundaries and original diagnostics
        run: |
          python -B -m unittest discover -s tests -v
          python -B -m unittest discover -s reference -v
      - name: Keep runtime dependencies only
        run: npm prune --prefix sample-api --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Create and verify a local archive without uploading
        env:
          SELECTED_SOURCE: ${{ github.sha }}
        run: python -B scripts/package-local.py --source-sha "$SELECTED_SOURCE"
